<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composio MCP Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.95em;
        }
        
        .content {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .section {
            display: flex;
            flex-direction: column;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="text"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95em;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .list {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .list-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .list-item:hover {
            background: #f9f9f9;
            transform: translateX(5px);
        }
        
        .list-item strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }
        
        .list-item small {
            color: #999;
            display: block;
            font-size: 0.85em;
            word-break: break-word;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background: #cfe2ff;
            color: #084298;
            border: 1px solid #b6d4fe;
        }
        
        .result {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .result.error {
            background: #ffe0e0;
            color: #c00;
        }
        
        .result.success {
            background: #e0ffe0;
            color: #0a0;
        }
        
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="close-btn" onclick="window.close()">✕</button>
            <h1>🔗 Composio MCP Integration</h1>
            <p>Подключай внешние сервисы и выполняй действия через MCP</p>
        </div>
        
        <div class="content">
            <!-- Левая часть: Подключение -->
            <div class="section">
                <h2>📱 Подключение</h2>
                
                <div id="status" class="status disconnected">
                    ⚪ Не подключено
                </div>
                
                <div class="form-group">
                    <label for="api_key">API Ключ Composio:</label>
                    <input type="password" id="api_key" placeholder="Введи API ключ от Composio">
                </div>
                
                <button onclick="connectComposio()">🔗 Подключиться</button>
                
                <h2 style="margin-top: 30px;">📋 Интеграции</h2>
                <div id="integrations" class="list">
                    <div class="empty-state">Подключись к Composio</div>
                </div>
            </div>
            
            <!-- Правая часть: Действия -->
            <div class="section">
                <h2>⚙️ Действия</h2>
                
                <div class="form-group">
                    <label for="action_select">Выбери действие:</label>
                    <select id="action_select">
                        <option value="">-- Подключись сначала --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="action_params">Параметры (JSON):</label>
                    <textarea id="action_params" rows="6" placeholder='{"key": "value"}'>{}</textarea>
                </div>
                
                <button onclick="executeAction()">▶️ Выполнить</button>
                
                <div id="result"></div>
            </div>
        </div>
    </div>
    
    <script>
        let isConnected = false;
        let allActions = [];
        
        async function connectComposio() {
            const apiKey = document.getElementById('api_key').value.trim();
            if (!apiKey) {
                alert('Введи API ключ!');
                return;
            }
            
            const status = document.getElementById('status');
            status.className = 'status loading';
            status.textContent = '⏳ Подключение...';
            
            try {
                const resp = await fetch('/api/composio/connect', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({api_key: apiKey})
                });
                
                if (!resp.ok) {
                    const error = await resp.json();
                    throw new Error(error.error || 'Ошибка подключения');
                }
                
                isConnected = true;
                status.className = 'status connected';
                status.textContent = '✅ Подключено!';
                
                document.getElementById('api_key').disabled = true;
                document.getElementById('api_key').type = 'text';
                
                await loadIntegrations();
                await loadActions();
            } catch (e) {
                status.className = 'status disconnected';
                status.textContent = `❌ Ошибка: ${e.message}`;
                console.error('Ошибка подключения:', e);
            }
        }
        
        async function loadIntegrations() {
            try {
                const resp = await fetch('/api/composio/integrations');
                const data = await resp.json();
                
                console.log('Интеграции:', data);
                
                if (data.integrations) {
                    let integrations = data.integrations;
                    
                    // Если это объект, преобразуем в массив
                    if (typeof integrations === 'object' && !Array.isArray(integrations)) {
                        integrations = Object.values(integrations).slice(0, 10);
                    }
                    
                    if (Array.isArray(integrations) && integrations.length > 0) {
                        const html = integrations
                            .slice(0, 10)
                            .map(integ => `
                                <div class="list-item">
                                    <strong>${integ.name || integ.display_name || integ.id || 'N/A'}</strong>
                                    <small>${integ.description || integ.app_name || 'Интеграция'}</small>
                                </div>
                            `).join('');
                        document.getElementById('integrations').innerHTML = html;
                    } else {
                        document.getElementById('integrations').innerHTML = '<div class="empty-state">Интеграции не найдены</div>';
                    }
                }
            } catch (e) {
                console.error('Ошибка загрузки интеграций:', e);
                document.getElementById('integrations').innerHTML = `<div class="empty-state">Ошибка: ${e.message}</div>`;
            }
        }
        
        async function loadActions() {
            try {
                const resp = await fetch('/api/composio/actions');
                const data = await resp.json();
                
                console.log('Действия:', data);
                
                if (data.actions) {
                    let actions = data.actions;
                    
                    // Если это объект, преобразуем в массив
                    if (typeof actions === 'object' && !Array.isArray(actions)) {
                        actions = Object.values(actions);
                    }
                    
                    if (!Array.isArray(actions)) {
                        actions = [];
                    }
                    
                    allActions = actions;
                    const select = document.getElementById('action_select');
                    select.innerHTML = '<option value="">-- Выбери действие --</option>';
                    
                    actions.slice(0, 50).forEach((action, idx) => {
                        const opt = document.createElement('option');
                        opt.value = idx;
                        opt.textContent = action.name || action.display_name || action.id || `Action ${idx}`;
                        select.appendChild(opt);
                    });
                    
                    if (actions.length === 0) {
                        select.innerHTML = '<option value="">Действия не найдены</option>';
                    }
                }
            } catch (e) {
                console.error('Ошибка загрузки действий:', e);
                document.getElementById('action_select').innerHTML = '<option value="">Ошибка загрузки</option>';
            }
        }
        
        async function executeAction() {
            if (!isConnected) {
                alert('Подключись к Composio сначала!');
                return;
            }
            
            const actionIdx = document.getElementById('action_select').value;
            if (!actionIdx && actionIdx !== 0) {
                alert('Выбери действие!');
                return;
            }
            
            const action = allActions[parseInt(actionIdx)];
            if (!action) {
                alert('Действие не найдено!');
                return;
            }
            
            let params = {};
            try {
                params = JSON.parse(document.getElementById('action_params').value);
            } catch (e) {
                alert('Ошибка в JSON параметрах!');
                return;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">⏳ Выполняю...</div>';
            
            try {
                const actionId = action.id || action.name;
                const resp = await fetch('/api/composio/execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: actionId,
                        params: params
                    })
                });
                
                const data = await resp.json();
                
                console.log('Результат:', data);
                
                if (resp.ok) {
                    resultDiv.innerHTML = `<div class="result success">✅ Успешно!\n${JSON.stringify(data.result || data, null, 2)}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Ошибка!\n${JSON.stringify(data, null, 2)}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error">❌ ${e.message}</div>`;
                console.error('Ошибка выполнения:', e);
            }
        }
    </script>
</body>
</html>
