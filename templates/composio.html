<!DOCTYPE html>
<html lang="tg" data-glass-theme="aurora">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Composio · NovaMind</title>
  <link rel="stylesheet" href="/static/liquid-glass.css">
  <script src="/static/i18n.js"></script>
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .wrap { max-width: 620px; width: 100%; padding: 26px; }
    .wrap h1 { font-size: 22px; letter-spacing: -.03em; margin-bottom: 10px; }
    .wrap p { color: var(--text-2); font-size: 13px; line-height: 1.65; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
    .tool {
      display: flex; align-items: center; gap: 9px; padding: 12px;
      border-radius: var(--r-sm); font-size: 12px; color: var(--text-1);
      background: rgba(255,255,255,.04); border: 1px solid var(--glass-border-soft);
      cursor: pointer; text-decoration: none;
      transition: transform .18s var(--ease-spring), border-color .28s var(--ease);
    }
    .tool:hover { transform: translateY(-2px); border-color: var(--glass-border); }
    code { background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="lg-grain" aria-hidden="true"></div>
  <div class="lg-vignette" aria-hidden="true"></div>

  <div class="wrap glass-panel">
    <div class="eyebrow">INTEGRATIONS</div>
    <h1>Composio</h1>
    <p>
      Подключение внешних сервисов (GitHub, Gmail, Notion, Slack и другие) выполняется прямо в чате:
      введите <code>/composio auth github</code> — NovaMind пришлёт карточку авторизации.
    </p>
    <p>Полезные команды:</p>
    <div class="grid">
      <span class="tool">📋 <code>/composio accounts</code></span>
      <span class="tool">🧰 <code>/composio tools github</code></span>
      <span class="tool">⚡ <code>/composio do …</code></span>
      <a class="tool" href="/chat">← Вернуться в чат</a>
    </div>
  </div>

  <script>
    document.documentElement.setAttribute('data-glass-theme', 'aurora');
  </script>
</body>
</html>
