<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaMind — MCP Servers</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
       background: #0d0d0d; color: #e6e6e6; min-height: 100vh; padding: 24px; }
.container { max-width: 1100px; margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #2a2a2a; margin-bottom: 24px; }
header h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
.badge { background: linear-gradient(135deg, #d97757, #c4654a); padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.layout { display: grid; grid-template-columns: 380px 1fr; gap: 20px; }
.card { background: #161616; border: 1px solid #2a2a2a; border-radius: 10px; padding: 18px; }
.card h2 { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
.server { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 8px; padding: 14px; margin-bottom: 10px; transition: all 0.15s; }
.server:hover { border-color: #3a3a3a; }
.server-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.server-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
.status-dot.connected { background: #10b981; box-shadow: 0 0 6px #10b98180; }
.status-dot.error { background: #ef4444; }
.server-cmd { font-family: 'SF Mono', Monaco, monospace; font-size: 11px; color: #888; word-break: break-all; margin: 6px 0; }
.server-desc { font-size: 12px; color: #888; margin-top: 6px; }
.server-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #3a3a3a; background: #1c1c1c; color: #e6e6e6; cursor: pointer; font-size: 12px; transition: all 0.15s; }
.btn:hover { background: #2a2a2a; border-color: #4a4a4a; }
.btn-primary { background: #d97757; border-color: #d97757; color: white; }
.btn-primary:hover { background: #c4654a; }
.btn-success { background: #10b981; border-color: #10b981; color: white; }
.btn-success:hover { background: #059669; }
.btn-danger { background: #ef4444; border-color: #ef4444; color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-ghost { background: transparent; border-color: transparent; color: #888; }
.btn-ghost:hover { background: #2a2a2a; color: #e6e6e6; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.toggle { position: relative; width: 36px; height: 20px; background: #333; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: left 0.2s; }
.toggle.on { background: #10b981; }
.toggle.on::after { left: 18px; }
.tool-list { max-height: 600px; overflow-y: auto; }
.tool { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 6px; padding: 10px; margin-bottom: 6px; font-size: 13px; }
.tool-name { font-family: 'SF Mono', Monaco, monospace; color: #d97757; font-size: 12px; }
.tool-desc { color: #aaa; margin-top: 4px; font-size: 12px; }
.tool-server { font-size: 10px; color: #666; margin-top: 4px; text-transform: uppercase; }
.empty { text-align: center; padding: 40px; color: #666; font-size: 14px; }
.add-form { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #2a2a2a; }
.add-form input, .add-form textarea { background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 6px; padding: 8px 10px; color: #e6e6e6; font-size: 13px; font-family: inherit; }
.add-form input:focus, .add-form textarea:focus { outline: none; border-color: #d97757; }
.add-form label { font-size: 11px; color: #888; text-transform: uppercase; margin-top: 6px; }
.toast { position: fixed; bottom: 20px; right: 20px; background: #1c1c1c; border: 1px solid #2a2a2a; padding: 12px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; z-index: 1000; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { border-color: #10b981; }
.toast.error { border-color: #ef4444; }
.help { font-size: 12px; color: #666; margin-top: 8px; line-height: 1.5; }
.help code { background: #0d0d0d; padding: 1px 6px; border-radius: 3px; font-size: 11px; }
.nav { display: flex; gap: 12px; align-items: center; }
.nav a { color: #888; text-decoration: none; font-size: 13px; padding: 6px 12px; border-radius: 6px; }
.nav a:hover { color: #e6e6e6; background: #1c1c1c; }
.nav a.active { color: #d97757; background: #1c1c1c; }
.chat-box { background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
.chat-box textarea { width: 100%; min-height: 60px; background: transparent; border: none; color: #e6e6e6; font-family: inherit; font-size: 13px; resize: vertical; }
.chat-box textarea:focus { outline: none; }
.chat-result { background: #1c1c1c; border-radius: 6px; padding: 12px; font-size: 13px; line-height: 1.5; max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
.chat-result:empty::before { content: 'Здесь появится ответ AI с использованием MCP tools...'; color: #555; }
.chat-meta { font-size: 11px; color: #888; margin-top: 6px; }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>🔌 MCP Servers <span class="badge">Model Context Protocol</span></h1>
        <nav class="nav">
            <a href="/chat">Чат</a>
            <a href="/composio">Composio</a>
            <a href="/mcp" class="active">MCP</a>
        </nav>
    </header>

    <div class="layout">
        <!-- Левая колонка: список серверов -->
        <div class="card">
            <h2>Серверы <span id="total-tools" style="color:#666;font-size:12px;text-transform:none"></span></h2>
            <div id="servers-list"></div>

            <div class="add-form">
                <label>Добавить сервер вручную:</label>
                <input id="add-name" placeholder="Имя (например: my-github)" />
                <input id="add-cmd" placeholder="Команда (npx, uvx, python)" />
                <textarea id="add-args" placeholder='Аргументы через запятую (например: -y, @org/server, /path)' rows="2"></textarea>
                <input id="add-desc" placeholder="Описание (необязательно)" />
                <button class="btn btn-primary" onclick="addServer()">+ Добавить</button>
                <div class="help">
                    💡 Формат совместим с <code>claude_desktop_config.json</code>.<br>
                    Популярные: <code>@modelcontextprotocol/server-filesystem</code>, <code>server-github</code>, <code>server-git</code>
                </div>
            </div>
        </div>

        <!-- Правая колонка: tools + чат -->
        <div>
            <div class="card" style="margin-bottom: 16px;">
                <h2>🤖 AI-чат с MCP tools</h2>
                <div class="chat-box">
                    <textarea id="chat-input" placeholder="Напиши запрос. Например: покажи содержимое README.md или найди мои PR на GitHub"></textarea>
                </div>
                <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
                    <button class="btn btn-primary" onclick="chat()">Отправить</button>
                    <button class="btn btn-ghost" onclick="document.getElementById('chat-input').value=''; document.getElementById('chat-result').innerHTML=''">Очистить</button>
                </div>
                <div id="chat-result" class="chat-result"></div>
                <div id="chat-meta" class="chat-meta"></div>
            </div>

            <div class="card">
                <h2>Доступные инструменты</h2>
                <div id="tools-list" class="tool-list">
                    <div class="empty">Подключи серверы чтобы увидеть tools</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = window.location.origin;

async function api(path, opts = {}) {
    const resp = await fetch(API + path, {
        headers: {"Content-Type": "application/json"},
        ...opts
    });
    return await resp.json();
}

function toast(msg, type = "success") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = `toast show ${type}`;
    setTimeout(() => el.className = "toast", 2500);
}

async function loadStatus() {
    const data = await api("/api/mcp/status");
    if (!data.available) {
        document.getElementById("servers-list").innerHTML = `<div class="empty">MCP SDK не установлен.<br>Выполни: <code>pip install mcp</code></div>`;
        return;
    }
    renderServers(data.servers);
    document.getElementById("total-tools").textContent = data.total_tools > 0 ? `(${data.total_tools} tools)` : "";
    loadTools();
}

function renderServers(servers) {
    const list = Object.entries(servers);
    if (list.length === 0) {
        document.getElementById("servers-list").innerHTML = `<div class="empty">Нет серверов в конфиге</div>`;
        return;
    }
    document.getElementById("servers-list").innerHTML = list.map(([name, s]) => `
        <div class="server">
            <div class="server-header">
                <div class="server-name">
                    <div class="status-dot ${s.connected ? 'connected' : ''}"></div>
                    ${name}
                    <span style="color:#666;font-size:11px;font-weight:normal">${s.tools_count > 0 ? `· ${s.tools_count} tools` : ''}</span>
                </div>
                <div class="toggle ${s.enabled ? 'on' : ''}" onclick="toggleServer('${name}')"></div>
            </div>
            <div class="server-cmd">${s.command} ${(s.args || []).join(' ')}</div>
            ${s.description ? `<div class="server-desc">${s.description}</div>` : ''}
            <div class="server-actions">
                <button class="btn btn-success" onclick="connectServer('${name}')" ${s.enabled ? '' : 'disabled'}>Подключить</button>
                <button class="btn" onclick="disconnectServer('${name}')" ${s.connected ? '' : 'disabled'}>Отключить</button>
                <button class="btn btn-ghost" onclick="deleteServer('${name}')">✕</button>
            </div>
        </div>
    `).join("");
}

async function toggleServer(name) {
    const data = await api("/api/mcp/status");
    const enabled = !data.servers[name].enabled;
    await api(`/api/mcp/servers/${name}`, {method: "PUT", body: JSON.stringify({enabled})});
    loadStatus();
}

async function connectServer(name) {
    toast("Подключаю " + name + "...");
    const data = await api("/api/mcp/connect", {method: "POST", body: JSON.stringify({name})});
    if (data.success) toast(`✓ ${name} подключён`, "success");
    else toast(`✗ Ошибка подключения ${name}`, "error");
    loadStatus();
}

async function disconnectServer(name) {
    await api("/api/mcp/disconnect", {method: "POST", body: JSON.stringify({name})});
    loadStatus();
}

async function deleteServer(name) {
    if (!confirm(`Удалить ${name}?`)) return;
    await api(`/api/mcp/servers/${name}`, {method: "DELETE"});
    loadStatus();
}

async function addServer() {
    const name = document.getElementById("add-name").value.trim();
    const cmd = document.getElementById("add-cmd").value.trim();
    const args = document.getElementById("add-args").value.split(",").map(s => s.trim()).filter(Boolean);
    const desc = document.getElementById("add-desc").value.trim();
    if (!name || !cmd) { toast("Заполни name и command", "error"); return; }
    await api("/api/mcp/servers", {method: "POST", body: JSON.stringify({name, command: cmd, args, enabled: true, description: desc})});
    toast(`✓ ${name} добавлен`);
    document.getElementById("add-name").value = "";
    document.getElementById("add-cmd").value = "";
    document.getElementById("add-args").value = "";
    document.getElementById("add-desc").value = "";
    loadStatus();
}

async function loadTools() {
    const data = await api("/api/mcp/tools");
    const list = document.getElementById("tools-list");
    if (data.count === 0) {
        list.innerHTML = `<div class="empty">Нет доступных tools.<br>Подключи серверы (например filesystem или github)</div>`;
        return;
    }
    list.innerHTML = data.tools.map(t => `
        <div class="tool">
            <div class="tool-name">${t.key}</div>
            <div class="tool-desc">${t.description || '—'}</div>
            <div class="tool-server">📡 ${t.server}</div>
        </div>
    `).join("");
}

async function chat() {
    const msg = document.getElementById("chat-input").value.trim();
    if (!msg) return;
    const resultEl = document.getElementById("chat-result");
    const metaEl = document.getElementById("chat-meta");
    resultEl.textContent = "⏳ Думаю...";
    metaEl.textContent = "";
    const data = await api("/api/mcp/chat", {method: "POST", body: JSON.stringify({message: msg})});
    if (data.error) {
        resultEl.textContent = "❌ " + data.error;
        return;
    }
    if (data.type === "tool") {
        resultEl.textContent = `[Tool: ${data.tool}]\nArgs: ${JSON.stringify(data.args, null, 2)}\n\nResult:\n${data.result || ''}\n\n${data.reply ? '💬 AI: ' + data.reply : ''}`;
        metaEl.textContent = `Использован ${data.tool}`;
    } else {
        resultEl.textContent = data.reply;
        metaEl.textContent = "Прямой ответ (без tool)";
    }
}

document.getElementById("chat-input").addEventListener("keydown", e => {
    if (e.ctrlKey && e.key === "Enter") chat();
});

loadStatus();
setInterval(loadStatus, 10000);  // автообновление каждые 10 сек
</script>
</body>
</html>
