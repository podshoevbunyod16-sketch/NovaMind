<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0b14;
            --bg-primary: #12121f;
            --bg-secondary: #1a1a2e;
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.08);
            --text-primary: #f0f0ff;
            --text-secondary: #8b8db0;
            --text-muted: #6b6d8b;
            --accent: #a855f7;
            --accent-glow: rgba(168,85,247,0.3);
            --accent-hover: #9333ea;
            --border: rgba(255,255,255,0.08);
            --error-bg: rgba(239,68,68,0.1);
            --error-text: #fca5a5;
            --success: #22c55e;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }
        .header {
            background: rgba(18,18,31,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
        .btn.accent { background: var(--accent); color: white; border-color: var(--accent); }
        .btn.accent:hover { background: var(--accent-hover); }
        .btn.danger { background: rgba(239,68,68,0.15); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
        .btn.danger:hover { background: rgba(239,68,68,0.25); }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            width: 100%;
        }
        .login-box {
            max-width: 400px;
            margin: 80px auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            text-align: center;
        }
        .login-box h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent);
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            background: var(--bg-deep);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
            margin-bottom: 12px;
            transition: border 0.2s;
        }
        .login-box input:focus { border-color: var(--accent); }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
        }
        .card h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }
        .card textarea,
        .card input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-deep);
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            font-family: 'JetBrains Mono', monospace;
            resize: vertical;
            transition: border 0.2s;
            margin-bottom: 12px;
        }
        .card textarea:focus,
        .card input[type="text"]:focus { border-color: var(--accent); }
        .card textarea { min-height: 200px; }
        .output-box {
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: #e2e8f0;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-item {
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            z-index: 100;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #ef4444; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ Админ-панель</h1>
        <div class="header-actions">
            <a href="/" class="btn">🏠 Главная</a>
            <button class="btn danger" onclick="logout()">🚪 Выйти</button>
        </div>
    </div>

    <!-- Экран логина -->
    <div id="loginScreen" class="login-box" style="display:none;">
        <h2>🔐 Вход в админ-панель</h2>
        <input type="text" id="username" placeholder="Логин">
        <input type="password" id="password" placeholder="Код">
        <button class="btn accent" style="width:100%;" onclick="login()">Войти</button>
        <p id="loginError" style="color:var(--error-text);margin-top:10px;font-size:0.85rem;"></p>
    </div>

    <!-- Дашборд -->
    <div id="dashboard" class="container" style="display:none;">
        <div class="dashboard">
            <!-- Статистика -->
            <div class="card">
                <h3>📊 Статистика</h3>
                <div class="stats-grid" id="statsGrid"></div>
            </div>

            <!-- Настройки -->
            <div class="card">
                <h3>⚙️ Настройки</h3>
                <label>Системный промпт</label>
                <textarea id="systemPrompt" rows="3"></textarea>
                <button class="btn accent" onclick="saveSettings()">💾 Сохранить</button>
            </div>

            <!-- Редактор кода -->
            <div class="card" style="grid-column: 1 / -1;">
                <h3>💻 Редактор кода</h3>
                <label>Название файла</label>
                <input type="text" id="codeFilename" placeholder="script.py" value="script.py">
                <label>Код (Python)</label>
                <textarea id="codeEditor" placeholder="# Введите ваш код здесь...
print('Привет из админ-панели!')" rows="8"></textarea>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button class="btn accent" onclick="saveAndRunCode()">💾 Сохранить и запустить</button>
                    <button class="btn" onclick="saveCode()">💾 Только сохранить</button>
                    <button class="btn" onclick="runSavedCode()">▶ Запустить сохранённый</button>
                </div>
                <div class="output-box" id="codeOutput">Здесь появится результат выполнения...</div>
            </div>

            <!-- Сохранённые файлы -->
            <div class="card" style="grid-column: 1 / -1;">
                <h3>📁 Сохранённые скрипты</h3>
                <div id="savedFiles" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const loginScreen = document.getElementById('loginScreen');
        const dashboard = document.getElementById('dashboard');
        const toast = document.getElementById('toast');

        // Проверка авторизации
        async function checkAuth() {
            try {
                const resp = await fetch('/api/admin/check');
                const data = await resp.json();
                if (data.logged_in) {
                    loginScreen.style.display = 'none';
                    dashboard.style.display = 'block';
                    loadDashboard();
                } else {
                    loginScreen.style.display = 'block';
                    dashboard.style.display = 'none';
                }
            } catch(e) {
                loginScreen.style.display = 'block';
                dashboard.style.display = 'none';
            }
        }

        // Логин
        async function login() {
            const username = document.getElementById('username').value.trim();
            const code = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            
            if (!username || !code) {
                errorEl.textContent = 'Заполните все поля';
                return;
            }
            
            try {
                const resp = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, code})
                });
                const data = await resp.json();
                if (data.error) {
                    errorEl.textContent = data.error;
                } else {
                    errorEl.textContent = '';
                    checkAuth();
                }
            } catch(e) {
                errorEl.textContent = 'Ошибка сети';
            }
        }

        // Выход
        async function logout() {
            await fetch('/api/admin/logout', {method: 'POST'});
            checkAuth();
        }

        // Загрузка дашборда
        async function loadDashboard() {
            try {
                const resp = await fetch('/api/admin/stats');
                const data = await resp.json();
                
                // Статистика
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-item"><div class="stat-value">${data.history_messages || 0}</div><div class="stat-label">Сообщений в истории</div></div>
                    <div class="stat-item"><div class="stat-value">${data.plugins_loaded?.length || 0}</div><div class="stat-label">Плагинов</div></div>
                    <div class="stat-item"><div class="stat-value">${data.custom_commands?.length || 0}</div><div class="stat-label">Своих команд</div></div>
                    <div class="stat-item"><div class="stat-value">${data.voice_enabled ? 'Да' : 'Нет'}</div><div class="stat-label">Озвучка</div></div>
                `;
                
                // Системный промпт
                document.getElementById('systemPrompt').value = data.system_prompt || '';
                
                // Загрузка списка сохранённых файлов
                loadSavedFiles();
                
            } catch(e) {
                showToast('Ошибка загрузки дашборда', true);
            }
        }

        // Сохранение настроек
        async function saveSettings() {
            const prompt = document.getElementById('systemPrompt').value;
            try {
                const resp = await fetch('/api/admin/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({system_prompt: prompt})
                });
                const data = await resp.json();
                if (data.success) showToast('Настройки сохранены!');
                else showToast('Ошибка сохранения', true);
            } catch(e) {
                showToast('Ошибка сети', true);
            }
        }

        // Сохранение кода
        async function saveCode() {
            const filename = document.getElementById('codeFilename').value.trim() || 'script.py';
            const code = document.getElementById('codeEditor').value;
            
            try {
                const resp = await fetch('/api/admin/save_code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename, code})
                });
                const data = await resp.json();
                if (data.success) {
                    showToast('Код сохранён: ' + data.filepath);
                    loadSavedFiles();
                } else {
                    showToast(data.error || 'Ошибка сохранения', true);
                }
            } catch(e) {
                showToast('Ошибка сети', true);
            }
        }

        // Сохранить и запустить
        async function saveAndRunCode() {
            await saveCode();
            await runSavedCode();
        }

        // Запуск сохранённого кода
        async function runSavedCode() {
            const filename = document.getElementById('codeFilename').value.trim() || 'script.py';
            const outputBox = document.getElementById('codeOutput');
            outputBox.textContent = 'Запуск...';
            
            try {
                const resp = await fetch('/api/admin/run_saved_code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename})
                });
                const data = await resp.json();
                if (data.error) {
                    outputBox.textContent = 'Ошибка: ' + data.error;
                } else {
                    outputBox.textContent = data.result || 'Нет вывода';
                }
            } catch(e) {
                outputBox.textContent = 'Ошибка сети: ' + e;
            }
        }

        // Загрузка списка сохранённых файлов
        async function loadSavedFiles() {
            try {
                const resp = await fetch('/api/admin/saved_codes');
                const data = await resp.json();
                const container = document.getElementById('savedFiles');
                if (!data.files || data.files.length === 0) {
                    container.innerHTML = '<span style="color:var(--text-muted);">Нет сохранённых файлов</span>';
                    return;
                }
                container.innerHTML = data.files.map(f => `
                    <button class="btn" onclick="loadCode('${f}')">📄 ${f}</button>
                `).join('');
            } catch(e) {
                document.getElementById('savedFiles').innerHTML = 'Ошибка загрузки';
            }
        }

        // Загрузка кода из файла в редактор
        async function loadCode(filename) {
            try {
                const resp = await fetch('/api/admin/load_code?file=' + encodeURIComponent(filename));
                const data = await resp.json();
                if (data.code) {
                    document.getElementById('codeFilename').value = filename;
                    document.getElementById('codeEditor').value = data.code;
                    showToast('Файл загружен: ' + filename);
                }
            } catch(e) {
                showToast('Ошибка загрузки', true);
            }
        }

        // Toast уведомления
        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = 'toast' + (isError ? ' error' : '') + ' show';
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // Запуск
        checkAuth();
    </script>
</body>
</html>
