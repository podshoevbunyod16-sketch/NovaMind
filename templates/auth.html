<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Khirad — Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/liquid-glass.css">
    <style>
        /* ═══ ОКНО ВХОДА · LIQUID GLASS ═══ */
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        .bg-mesh {
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background:
                radial-gradient(45vmax 45vmax at 15% 20%, color-mix(in srgb, var(--accent) 40%, transparent), transparent 65%),
                radial-gradient(40vmax 40vmax at 85% 25%, color-mix(in srgb, var(--accent-2) 34%, transparent), transparent 62%),
                radial-gradient(46vmax 46vmax at 70% 85%, color-mix(in srgb, var(--accent-3) 30%, transparent), transparent 64%);
            animation: mesh-drift 34s var(--ease) infinite alternate;
        }
        @keyframes mesh-drift {
            from { transform: translate3d(0,0,0) scale(1.02); }
            to   { transform: translate3d(-2%, 3%, 0) scale(1.1); }
        }

        .auth-modal { width: 100%; max-width: 430px; }

        .auth-modal__container {
            position: relative;
            padding: 30px 26px;
            border-radius: var(--r-xl);
            background: linear-gradient(158deg, var(--glass-fill-strong), var(--glass-fill) 62%, rgba(255,255,255,.02));
            -webkit-backdrop-filter: blur(var(--glass-blur-lg)) saturate(190%);
            backdrop-filter: blur(var(--glass-blur-lg)) saturate(190%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow-lg), var(--glass-inset);
            overflow: hidden;
            animation: card-in .7s var(--ease-out) both;
        }
        @keyframes card-in {
            from { opacity: 0; transform: translateY(26px) scale(.96); }
            to   { opacity: 1; transform: none; }
        }
        /* Бегущий блик по стеклу карточки */
        .auth-modal__container::after {
            content: "";
            position: absolute; top: -60%; left: -70%;
            width: 55%; height: 220%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.14), transparent);
            transform: skewX(-18deg);
            animation: glass-sheen 7s var(--ease) infinite;
            pointer-events: none;
        }
        @keyframes glass-sheen {
            0%, 62% { left: -70%; }
            100%    { left: 140%; }
        }

        .auth-form { display: none; position: relative; z-index: 1; }
        .auth-form.active { display: block; animation: lg-fade-in .45s var(--ease-out) both; }

        .auth-form__header { text-align: center; margin-bottom: 22px; }
        .auth-form__logo {
            display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 14px;
            font-size: 17px; font-weight: 800; letter-spacing: -.02em;
        }
        .auth-form__logo-icon {
            width: 44px; height: 44px; border-radius: 14px;
            display: grid; place-items: center;
            font-size: 15px; font-weight: 900; color: #fff;
            background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.85), transparent 46%),
                        linear-gradient(140deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 26px -10px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.5);
            animation: orb-breathe 5s var(--ease) infinite;
        }
        @keyframes orb-breathe {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.05); }
        }
        .auth-form__header h2 { font-size: 21px; letter-spacing: -.03em; margin-bottom: 6px; }
        .auth-form__header p { font-size: 12.5px; color: var(--text-3); line-height: 1.6; }

        .auth-form__group { margin-bottom: 14px; }
        .auth-form__group label {
            display: block; margin-bottom: 6px;
            font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
            color: var(--text-4);
        }
        .auth-form__input-wrap { position: relative; display: flex; align-items: center; }
        .auth-form__input-wrap i {
            position: absolute; left: 14px; font-size: 13px; color: var(--text-4);
            font-style: normal; pointer-events: none;
        }
        .auth-form__input-wrap input,
        .auth-form__group > input {
            width: 100%;
            padding: 13px 15px 13px 40px;
            font: 500 13.5px/1.4 inherit;
            color: var(--text-1);
            background: linear-gradient(160deg, var(--glass-fill), rgba(255,255,255,.02));
            border: 1px solid var(--glass-border-soft);
            border-radius: var(--r-sm);
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0,0,0,.16);
            transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
        }
        .auth-form__group > input { padding-left: 15px; }
        .auth-form__input-wrap input:focus,
        .auth-form__group > input:focus {
            border-color: color-mix(in srgb, var(--accent) 60%, transparent);
            box-shadow: 0 0 0 3px var(--accent-soft), inset 0 1px 2px rgba(0,0,0,.12);
        }
        .auth-form__input-wrap input::placeholder,
        .auth-form__group > input::placeholder { color: var(--text-4); }

        .auth-form__toggle-password {
            position: absolute; right: 8px;
            width: 30px; height: 30px; border-radius: 50%;
            display: grid; place-items: center;
            background: transparent; border: none; cursor: pointer;
            color: var(--text-4); font-size: 13px;
            transition: color var(--t) var(--ease), background var(--t) var(--ease);
        }
        .auth-form__toggle-password:hover { color: var(--text-1); background: var(--glass-fill); }

        .auth-form__row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .auth-form__checkbox {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--text-2); cursor: pointer;
        }
        .auth-form__checkbox input {
            width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;
        }

        .auth-form__submit {
            width: 100%; padding: 14px;
            font: 800 13.5px/1 inherit; letter-spacing: .02em;
            color: var(--on-accent); cursor: pointer;
            background: linear-gradient(150deg, var(--accent), var(--accent-2));
            border: 1px solid color-mix(in srgb, var(--accent) 45%, rgba(255,255,255,.2));
            border-radius: var(--r-sm);
            box-shadow: 0 16px 34px -16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.4);
            transition: transform var(--t-fast) var(--ease-spring), filter var(--t) var(--ease);
        }
        .auth-form__submit:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .auth-form__submit:active { transform: scale(.985); }

        .auth-error { min-height: 16px; margin: 10px 0 0; font-size: 11.5px; color: var(--err); text-align: center; }

        .auth-form__divider {
            display: flex; align-items: center; gap: 12px;
            margin: 18px 0 14px; color: var(--text-4); font-size: 11px;
        }
        .auth-form__divider::before, .auth-form__divider::after {
            content: ""; flex: 1; height: 1px; background: var(--glass-border-soft);
        }

        .auth-form__social { display: flex; gap: 10px; align-items: center; }
        .auth-form__social-btn {
            flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 14px; font: 700 12.5px/1 inherit; cursor: pointer;
            color: var(--text-1);
            background: var(--glass-fill);
            border: 1px solid var(--glass-border-soft);
            border-radius: var(--r-sm);
            transition: background var(--t) var(--ease), transform var(--t-fast) var(--ease-spring);
        }
        .auth-form__social-btn:hover { background: var(--glass-fill-2); transform: translateY(-1px); }

        .auth-form__footer {
            margin-top: 18px; padding-top: 14px;
            border-top: 1px solid var(--glass-border-soft);
            text-align: center; font-size: 12px; color: var(--text-3);
        }
        .auth-form__footer a {
            color: color-mix(in srgb, var(--accent) 60%, white);
            font-weight: 700; cursor: pointer; text-decoration: none;
        }
        html[data-glass-theme="light"] .auth-form__footer a { color: var(--accent); }
        .auth-form__footer a:hover { text-decoration: underline; }

        .auth-theme-row { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
        .auth-theme-row button {
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
            border: 1px solid var(--glass-border-soft);
            background: var(--glass-fill);
            transition: transform var(--t-fast) var(--ease-spring), border-color var(--t) var(--ease);
        }
        .auth-theme-row button:hover { transform: scale(1.12); border-color: var(--glass-border); }
        .auth-theme-row button.t-aurora   { background: linear-gradient(140deg, #7c3aed, #22d3ee); }
        .auth-theme-row button.t-midnight { background: linear-gradient(140deg, #0ea5e9, #2dd4bf); }
        .auth-theme-row button.t-sunset   { background: linear-gradient(140deg, #fb7185, #fbbf24); }
        .auth-theme-row button.t-light    { background: linear-gradient(140deg, #e2e8f0, #a78bfa); }

        @media (max-width: 460px) {
            .auth-modal__container { padding: 24px 18px; }
            .auth-form__header h2 { font-size: 19px; }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="lg-grain" aria-hidden="true"></div>
    <div class="lg-vignette" aria-hidden="true"></div>

    <div class="auth-modal">
        <div class="auth-modal__container">

            <!-- ═══════════ ВХОД ═══════════ -->
            <div class="auth-form active" id="loginForm">
                <div class="auth-form__header">
                    <div class="auth-form__logo">
                        <span class="auth-form__logo-icon">NM</span>
                        <span>Khirad</span>
                    </div>
                    <h2>Вход в аккаунт</h2>
                    <p>Войдите, чтобы использовать AI-ассистента</p>
                </div>

                <div class="auth-form__body">
                    <div class="auth-form__group">
                        <label>Никнейм</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" placeholder="Введите никнейм" id="loginNick">
                        </div>
                    </div>

                    <div class="auth-form__group">
                        <label>Код доступа</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Введите код" id="loginCode">
                            <button type="button" class="auth-form__toggle-password" onclick="togglePassword('loginCode', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-form__row">
                        <label class="auth-form__checkbox">
                            <input type="checkbox" id="rememberMe" checked>
                            <span>Запомнить меня</span>
                        </label>
                    </div>

                    <button class="auth-form__submit" onclick="handleLogin()">Войти</button>
                    <p class="auth-error" id="loginError"></p>

                    <div class="auth-form__divider"><span>или</span></div>

                    <div class="auth-form__social">
                        <!-- Google Sign-In кнопка -->
                        <div id="g_id_signin" style="flex: 1; display: flex; justify-content: center;"></div>
                        <button class="auth-form__social-btn" onclick="quickLogin('Guest')" type="button">
                            <i class="fas fa-user"></i> Гость
                        </button>
                    </div>
                </div>

                <div class="auth-form__footer">
                    <p>Нет аккаунта? <a onclick="showForm('register')">Зарегистрироваться</a></p>
                </div>
            </div>

            <!-- ═══════════ РЕГИСТРАЦИЯ ═══════════ -->
            <div class="auth-form" id="registerForm" style="display: none;">
                <div class="auth-form__header">
                    <div class="auth-form__logo">
                        <span class="auth-form__logo-icon">NM</span>
                        <span>Khirad</span>
                    </div>
                    <h2>Регистрация</h2>
                    <p>Создайте аккаунт для доступа к AI</p>
                </div>

                <div class="auth-form__body">
                    <div class="auth-form__group">
                        <label>Никнейм *</label>
                        <input type="text" placeholder="Ваш никнейм" id="regNick">
                    </div>

                    <div class="auth-form__group">
                        <label>Код доступа *</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Придумайте код (минимум 3 символа)" id="regCode">
                        </div>
                    </div>

                    <div class="auth-form__group">
                        <label>Подтвердите код *</label>
                        <input type="password" placeholder="Повторите код" id="regCodeConfirm">
                    </div>

                    <label class="auth-form__checkbox" style="margin-bottom: 16px;">
                        <input type="checkbox" id="regAgree">
                        <span>Я согласен с правилами использования</span>
                    </label>

                    <button class="auth-form__submit" onclick="handleRegister()">Зарегистрироваться</button>
                    <p class="auth-error" id="regError"></p>
                </div>

                <div class="auth-form__footer">
                    <p>Уже есть аккаунт? <a onclick="showForm('login')">Войти</a></p>
                </div>
            </div>

            <div class="auth-theme-row" aria-label="Тема оформления: Aurora">
                <button type="button" class="t-aurora" title="Aurora" onclick="setAuthTheme('aurora')"></button>
            </div>

        </div>
    </div>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        const GOOGLE_CLIENT_ID = "{{ google_client_id }}";

        // Инициализация Google Sign-In
        function initGoogleSignIn() {
            if (GOOGLE_CLIENT_ID && window.google) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleResponse,
                    auto_select: false,
                });

                google.accounts.id.renderButton(
                    document.getElementById('g_id_signin'),
                    { 
                        type: 'standard',
                        theme: 'outline',
                        size: 'large',
                        text: 'signin_with',
                        shape: 'pill',
                        width: '100%'
                    }
                );
            }
        }

        // Ждём загрузку Google SDK
        window.addEventListener('load', function() {
            setTimeout(initGoogleSignIn, 500);
        });

        function handleGoogleResponse(response) {
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                const nick = payload.name || payload.email.split('@')[0];

                localStorage.setItem('nova_user_nick', nick);
                localStorage.setItem('nova_user_email', payload.email || '');
                localStorage.setItem('nova_user_avatar', payload.picture || '');
                localStorage.setItem('nova_is_admin', 'false');
                localStorage.setItem('nova_google_login', 'true');

                window.location.href = '/chat';
            } catch (e) {
                document.getElementById('loginError').textContent = 'Ошибка входа через Google';
            }
        }

        function showForm(form) {
            const login = document.getElementById('loginForm');
            const register = document.getElementById('registerForm');
            login.classList.toggle('active', form === 'login');
            register.classList.toggle('active', form === 'register');
            login.style.display = form === 'login' ? 'block' : 'none';
            register.style.display = form === 'register' ? 'block' : 'none';
        }

        // ── Тема стекла (сохраняется и применяется во всём приложении) ──
        function setAuthTheme(theme) {
            // Тема одна — Aurora.
            document.documentElement.setAttribute('data-glass-theme', 'aurora');
            localStorage.setItem('nova_theme', 'aurora');
        }
        setAuthTheme('aurora');

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function handleLogin() {
            const nick = document.getElementById('loginNick').value.trim();
            const code = document.getElementById('loginCode').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!nick || !code) {
                errorEl.textContent = 'Заполните все поля';
                return;
            }

            localStorage.setItem('nova_user_nick', nick);

            try {
                const resp = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: 'admin', code: code})
                });
                const data = await resp.json();
                localStorage.setItem('nova_is_admin', data.success ? 'true' : 'false');
                window.location.href = '/chat';
            } catch (e) {
                localStorage.setItem('nova_is_admin', 'false');
                window.location.href = '/chat';
            }
        }

        function handleRegister() {
            const nick = document.getElementById('regNick').value.trim();
            const code = document.getElementById('regCode').value.trim();
            const confirm = document.getElementById('regCodeConfirm').value.trim();
            const agree = document.getElementById('regAgree').checked;
            const errorEl = document.getElementById('regError');

            if (!nick || !code) { errorEl.textContent = 'Заполните все поля'; return; }
            if (code.length < 3) { errorEl.textContent = 'Код должен быть не менее 3 символов'; return; }
            if (code !== confirm) { errorEl.textContent = 'Коды не совпадают'; return; }
            if (!agree) { errorEl.textContent = 'Примите условия использования'; return; }

            localStorage.setItem('nova_user_nick', nick);
            localStorage.setItem('nova_user_code', code);
            localStorage.setItem('nova_is_admin', 'false');
            syncServerSession(nick);
            window.location.href = '/chat';
        }

        // Серверная сессия: без неё рабочая папка и агентный режим
        // не откроются — сервер не знает про вход по нику.
        function syncServerSession(nick) {
            fetch('/api/session/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({nick: nick})
            }).catch(() => {});
        }

        function quickLogin(type) {
            document.getElementById('loginNick').value = type + '_User';
            document.getElementById('loginCode').value = type.toLowerCase() + '_' + Date.now();
            handleLogin();
        }
    </script>
</body>
</html>
