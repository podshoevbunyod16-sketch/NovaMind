<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>NovaMind — Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0d0d14 0%, #1a1a2e 50%, #12121f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-mesh {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(123,47,247,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(168,85,247,0.1) 0%, transparent 55%);
            pointer-events: none;
        }

        .auth-modal {
            position: relative;
            z-index: 1;
            width: 440px;
            max-width: 92vw;
        }

        .auth-modal__container {
            position: relative;
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-form {
            padding: 30px 28px;
        }

        .auth-form__header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-form__logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 800;
            color: #1a1a2e;
        }

        .auth-form__logo-icon {
            background: #7c3aed;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 900;
        }

        .auth-form__header h2 {
            font-size: 22px;
            font-weight: 800;
            color: #1a1a2e;
            margin: 0 0 6px;
        }

        .auth-form__header p {
            font-size: 13px;
            color: #999;
            margin: 0;
        }

        .auth-form__body {
            margin-bottom: 20px;
        }

        .auth-form__group {
            margin-bottom: 14px;
        }

        .auth-form__group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .auth-form__group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            outline: none;
            transition: 0.2s;
            background: #fff;
        }

        .auth-form__group input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .auth-form__input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-form__input-wrap i {
            position: absolute;
            left: 14px;
            color: #999;
            font-size: 16px;
            z-index: 1;
        }

        .auth-form__input-wrap input {
            padding-left: 40px;
        }

        .auth-form__toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
        }

        .auth-form__toggle-password:hover {
            color: #7c3aed;
        }

        .auth-form__row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .auth-form__checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #333;
        }

        .auth-form__checkbox input {
            width: 16px;
            height: 16px;
        }

        .auth-form__submit {
            width: 100%;
            padding: 14px;
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .auth-form__submit:hover {
            background: #6d28d9;
        }

        .auth-form__submit:active {
            transform: scale(0.97);
        }

        .auth-form__divider {
            text-align: center;
            margin: 16px 0;
            color: #ccc;
            font-size: 13px;
            position: relative;
        }

        .auth-form__divider::before,
        .auth-form__divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: #e0e0e0;
        }

        .auth-form__divider::before { left: 0; }
        .auth-form__divider::after { right: 0; }

        .auth-form__social {
            display: flex;
            gap: 10px;
        }

        .auth-form__social-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .auth-form__social-btn:hover {
            border-color: #7c3aed;
            background: #f5f0ff;
        }

        .auth-form__footer {
            text-align: center;
            font-size: 13px;
            color: #999;
        }

        .auth-form__footer a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-error {
            color: #ef4444;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            min-height: 18px;
        }

        @media (max-width: 480px) {
            .auth-modal__container {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                top: auto;
                width: 100%;
                max-width: 100%;
                border-radius: 20px 20px 0 0;
                max-height: 90vh;
            }
            .auth-form {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>

    <div class="auth-modal">
        <div class="auth-modal__container">

            <!-- ═══════════ ВХОД ═══════════ -->
            <div class="auth-form active" id="loginForm">
                <div class="auth-form__header">
                    <div class="auth-form__logo">
                        <span class="auth-form__logo-icon">NM</span>
                        <span>NovaMind</span>
                    </div>
                    <h2>Вход в аккаунт</h2>
                    <p>Войдите, чтобы использовать AI-ассистента</p>
                </div>

                <div class="auth-form__body">
                    <div class="auth-form__group">
                        <label>Никнейм</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" placeholder="Введите никнейм" id="loginNick">
                        </div>
                    </div>

                    <div class="auth-form__group">
                        <label>Код доступа</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Введите код" id="loginCode">
                            <button type="button" class="auth-form__toggle-password" onclick="togglePassword('loginCode', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-form__row">
                        <label class="auth-form__checkbox">
                            <input type="checkbox" id="rememberMe" checked>
                            <span>Запомнить меня</span>
                        </label>
                    </div>

                    <button class="auth-form__submit" onclick="handleLogin()">Войти</button>
                    <p class="auth-error" id="loginError"></p>

                    <div class="auth-form__divider"><span>или</span></div>

                    <div class="auth-form__social">
                        <!-- Google Sign-In кнопка -->
                        <div id="g_id_signin" style="flex: 1; display: flex; justify-content: center;"></div>
                        <button class="auth-form__social-btn" onclick="quickLogin('Guest')" type="button">
                            <i class="fas fa-user"></i> Гость
                        </button>
                    </div>
                </div>

                <div class="auth-form__footer">
                    <p>Нет аккаунта? <a onclick="showForm('register')">Зарегистрироваться</a></p>
                </div>
            </div>

            <!-- ═══════════ РЕГИСТРАЦИЯ ═══════════ -->
            <div class="auth-form" id="registerForm" style="display: none;">
                <div class="auth-form__header">
                    <div class="auth-form__logo">
                        <span class="auth-form__logo-icon">NM</span>
                        <span>NovaMind</span>
                    </div>
                    <h2>Регистрация</h2>
                    <p>Создайте аккаунт для доступа к AI</p>
                </div>

                <div class="auth-form__body">
                    <div class="auth-form__group">
                        <label>Никнейм *</label>
                        <input type="text" placeholder="Ваш никнейм" id="regNick">
                    </div>

                    <div class="auth-form__group">
                        <label>Код доступа *</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Придумайте код (минимум 3 символа)" id="regCode">
                        </div>
                    </div>

                    <div class="auth-form__group">
                        <label>Подтвердите код *</label>
                        <input type="password" placeholder="Повторите код" id="regCodeConfirm">
                    </div>

                    <label class="auth-form__checkbox" style="margin-bottom: 16px;">
                        <input type="checkbox" id="regAgree">
                        <span>Я согласен с правилами использования</span>
                    </label>

                    <button class="auth-form__submit" onclick="handleRegister()">Зарегистрироваться</button>
                    <p class="auth-error" id="regError"></p>
                </div>

                <div class="auth-form__footer">
                    <p>Уже есть аккаунт? <a onclick="showForm('login')">Войти</a></p>
                </div>
            </div>

        </div>
    </div>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        const GOOGLE_CLIENT_ID = "{{ google_client_id }}";

        // Инициализация Google Sign-In
        function initGoogleSignIn() {
            if (GOOGLE_CLIENT_ID && window.google) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleResponse,
                    auto_select: false,
                });

                google.accounts.id.renderButton(
                    document.getElementById('g_id_signin'),
                    { 
                        type: 'standard',
                        theme: 'outline',
                        size: 'large',
                        text: 'signin_with',
                        shape: 'pill',
                        width: '100%'
                    }
                );
            }
        }

        // Ждём загрузку Google SDK
        window.addEventListener('load', function() {
            setTimeout(initGoogleSignIn, 500);
        });

        function handleGoogleResponse(response) {
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                const nick = payload.name || payload.email.split('@')[0];

                localStorage.setItem('nova_user_nick', nick);
                localStorage.setItem('nova_user_email', payload.email || '');
                localStorage.setItem('nova_user_avatar', payload.picture || '');
                localStorage.setItem('nova_is_admin', 'false');
                localStorage.setItem('nova_google_login', 'true');

                window.location.href = '/chat';
            } catch (e) {
                document.getElementById('loginError').textContent = 'Ошибка входа через Google';
            }
        }

        function showForm(form) {
            document.getElementById('loginForm').style.display = form === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = form === 'register' ? 'block' : 'none';
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function handleLogin() {
            const nick = document.getElementById('loginNick').value.trim();
            const code = document.getElementById('loginCode').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!nick || !code) {
                errorEl.textContent = 'Заполните все поля';
                return;
            }

            localStorage.setItem('nova_user_nick', nick);

            try {
                const resp = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: 'admin', code: code})
                });
                const data = await resp.json();
                localStorage.setItem('nova_is_admin', data.success ? 'true' : 'false');
                window.location.href = '/chat';
            } catch (e) {
                localStorage.setItem('nova_is_admin', 'false');
                window.location.href = '/chat';
            }
        }

        function handleRegister() {
            const nick = document.getElementById('regNick').value.trim();
            const code = document.getElementById('regCode').value.trim();
            const confirm = document.getElementById('regCodeConfirm').value.trim();
            const agree = document.getElementById('regAgree').checked;
            const errorEl = document.getElementById('regError');

            if (!nick || !code) { errorEl.textContent = 'Заполните все поля'; return; }
            if (code.length < 3) { errorEl.textContent = 'Код должен быть не менее 3 символов'; return; }
            if (code !== confirm) { errorEl.textContent = 'Коды не совпадают'; return; }
            if (!agree) { errorEl.textContent = 'Примите условия использования'; return; }

            localStorage.setItem('nova_user_nick', nick);
            localStorage.setItem('nova_user_code', code);
            localStorage.setItem('nova_is_admin', 'false');
            window.location.href = '/chat';
        }

        function quickLogin(type) {
            document.getElementById('loginNick').value = type + '_User';
            document.getElementById('loginCode').value = type.toLowerCase() + '_' + Date.now();
            handleLogin();
        }
    </script>
</body>
</html>
