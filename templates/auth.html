<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Khirad — Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { height: 100%; }
        body {
            height: 100%;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0d0d14 0%, #1a1a2e 50%, #12121f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-mesh {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(123,47,247,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(168,85,247,0.1) 0%, transparent 55%);
            pointer-events: none;
        }

        .auth-modal {
            position: relative;
            z-index: 1;
            width: 440px;
            max-width: 92vw;
        }

        .auth-modal__container {
            position: relative;
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .auth-form {
            padding: 30px 28px;
        }

        .auth-form__header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-form__logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 800;
            color: #1a1a2e;
        }

        .auth-form__logo-icon {
            background: #7c3aed;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 900;
        }

        .auth-form__header h2 {
            font-size: 22px;
            font-weight: 800;
            color: #1a1a2e;
            margin: 0 0 6px;
        }

        .auth-form__header p {
            font-size: 13px;
            color: #999;
            margin: 0;
        }

        .auth-form__body {
            margin-bottom: 20px;
        }

        .auth-form__group {
            margin-bottom: 14px;
        }

        .auth-form__group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .auth-form__group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            outline: none;
            transition: 0.2s;
            background: #fff;
        }

        .auth-form__group input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .auth-form__input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .auth-form__input-wrap i {
            position: absolute;
            left: 14px;
            color: #999;
            font-size: 16px;
            z-index: 1;
        }

        .auth-form__input-wrap input {
            padding-left: 40px;
        }

        .auth-form__toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            padding: 6px;
        }

        .auth-form__toggle-password:hover {
            color: #7c3aed;
        }

        .auth-form__row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .auth-form__checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #333;
        }

        .auth-form__checkbox input {
            width: 16px;
            height: 16px;
        }

        .auth-form__submit {
            width: 100%;
            padding: 14px;
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .auth-form__submit:hover {
            background: #6d28d9;
        }

        .auth-form__submit:active {
            transform: scale(0.97);
        }

        .auth-form__divider {
            text-align: center;
            margin: 16px 0;
            color: #ccc;
            font-size: 13px;
            position: relative;
        }

        .auth-form__divider::before,
        .auth-form__divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 35%;
            height: 1px;
            background: #e0e0e0;
        }

        .auth-form__divider::before { left: 0; }
        .auth-form__divider::after { right: 0; }

        .auth-form__social {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .auth-form__social-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .auth-form__social-btn:hover {
            border-color: #7c3aed;
            background: #f5f0ff;
        }

        .auth-form__footer {
            text-align: center;
            font-size: 13px;
            color: #999;
        }

        .auth-form__footer a {
            color: #7c3aed;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-error {
            color: #ef4444;
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            min-height: 18px;
        }

        .auth-loading {
            text-align: center;
            padding: 40px;
            color: #7c3aed;
            font-size: 15px;
        }

        .auth-loading i {
            font-size: 32px;
            display: block;
            margin-bottom: 12px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-modal__container {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                top: auto;
                width: 100%;
                max-width: 100%;
                border-radius: 20px 20px 0 0;
                max-height: 90vh;
            }
            .auth-form {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>

    <div class="auth-modal">
        <div class="auth-modal__container">

            <!-- Загрузка (автовход) -->
            <div class="auth-form" id="loadingForm" style="display:none;">
                <div class="auth-loading">
                    <i class="fas fa-spinner"></i>
                    Входим в аккаунт...
                </div>
            </div>

            <!-- ═══════════ ВХОД ═══════════ -->
            <div class="auth-form active" id="loginForm">
                <div class="auth-form__header">
                    <div class="auth-form__logo">
                        <span class="auth-form__logo-icon">NM</span>
                        <span>Khirad</span>
                    </div>
                    <h2>Вход в аккаунт</h2>
                    <p>Войдите, чтобы использовать AI-ассистента Khirad</p>
                </div>

                <div class="auth-form__body">
                    <div class="auth-form__group">
                        <label>Email</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" placeholder="Введите email" id="loginEmail" autocomplete="email">
                        </div>
                    </div>

                    <div class="auth-form__group">
                        <label>Пароль</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Введите пароль" id="loginCode" autocomplete="current-password">
                            <button type="button" class="auth-form__toggle-password" onclick="togglePassword('loginCode', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-form__row">
                        <label class="auth-form__checkbox">
                            <input type="checkbox" id="rememberMe" checked>
                            <span>Запомнить меня</span>
                        </label>
                    </div>

                    <button class="auth-form__submit" onclick="handleLogin()">Войти</button>
                    <p class="auth-error" id="loginError"></p>

                    <div class="auth-form__divider"><span>или войти через</span></div>

                    <div class="auth-form__social">
                        <!-- Google Sign-In кнопка -->
                        <div id="g_id_signin" style="display:flex; justify-content:center; width:100%;"></div>
                    </div>
                </div>

                <div class="auth-form__footer">
                    <p>Нет аккаунта? <a onclick="showForm('register')">Зарегистрироваться</a></p>
                </div>
            </div>

            <!-- ═══════════ РЕГИСТРАЦИЯ ═══════════ -->
            <div class="auth-form" id="registerForm" style="display: none;">
                <div class="auth-form__header">
                    <div class="auth-form__logo">
                        <span class="auth-form__logo-icon">NM</span>
                        <span>Khirad</span>
                    </div>
                    <h2>Регистрация</h2>
                    <p>Создайте аккаунт для доступа к AI</p>
                </div>

                <div class="auth-form__body">
                    <div class="auth-form__group">
                        <label>Никнейм *</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-user"></i>
                            <input type="text" placeholder="Ваш никнейм" id="regNick" autocomplete="nickname">
                        </div>
                    </div>

                    <div class="auth-form__group">
                        <label>Email *</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-envelope"></i>
                            <input type="email" placeholder="Ваш email" id="regEmail" autocomplete="email">
                        </div>
                    </div>

                    <div class="auth-form__group">
                        <label>Пароль *</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Придумайте пароль (минимум 4 символа)" id="regCode" autocomplete="new-password">
                            <button type="button" class="auth-form__toggle-password" onclick="togglePassword('regCode', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-form__group">
                        <label>Подтвердите пароль *</label>
                        <div class="auth-form__input-wrap">
                            <i class="fas fa-lock"></i>
                            <input type="password" placeholder="Повторите пароль" id="regCodeConfirm" autocomplete="new-password">
                        </div>
                    </div>

                    <label class="auth-form__checkbox" style="margin-bottom: 16px;">
                        <input type="checkbox" id="regAgree">
                        <span>Я согласен с правилами использования</span>
                    </label>

                    <button class="auth-form__submit" onclick="handleRegister()">Зарегистрироваться</button>
                    <p class="auth-error" id="regError"></p>
                </div>

                <div class="auth-form__footer">
                    <p>Уже есть аккаунт? <a onclick="showForm('login')">Войти</a></p>
                </div>
            </div>

        </div>
    </div>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        const GOOGLE_CLIENT_ID = "{{ google_client_id }}";

        // ══════════════════════════════════════════
        // АВТОВХОД: Проверяем сохранённые данные
        // ══════════════════════════════════════════
        (function checkAutoLogin() {
            const saved = localStorage.getItem('nova_remember_data');
            if (!saved) return;
            try {
                const data = JSON.parse(saved);
                // Проверяем срок (30 дней)
                if (!data.expires || Date.now() > data.expires) {
                    localStorage.removeItem('nova_remember_data');
                    return;
                }
                // Есть сохранённые данные — показываем загрузку и входим
                document.addEventListener('DOMContentLoaded', function() {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('loadingForm').style.display = 'block';

                    // Восстанавливаем данные в localStorage (совместимость с остальным кодом)
                    localStorage.setItem('nova_user_nick', data.nick || '');
                    localStorage.setItem('nova_user_email', data.email || '');
                    localStorage.setItem('nova_user_avatar', data.avatar || '');
                    localStorage.setItem('nova_is_admin', data.is_admin || 'false');
                    if (data.google_login) {
                        localStorage.setItem('nova_google_login', 'true');
                    }

                    setTimeout(function() {
                        window.location.href = '/chat';
                    }, 600);
                });
            } catch(e) {
                localStorage.removeItem('nova_remember_data');
            }
        })();

        // Сохраняем данные пользователя на 30 дней
        function saveRememberMe(nick, email, avatar, isAdmin, googleLogin) {
            const data = {
                nick: nick,
                email: email,
                avatar: avatar || '',
                is_admin: isAdmin || 'false',
                google_login: googleLogin || false,
                expires: Date.now() + (30 * 24 * 60 * 60 * 1000) // 30 дней
            };
            localStorage.setItem('nova_remember_data', JSON.stringify(data));
        }

        // ══════════════════════════════════════════
        // Google Sign-In
        // ══════════════════════════════════════════
        function initGoogleSignIn() {
            if (GOOGLE_CLIENT_ID && window.google) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleResponse,
                    auto_select: false,
                });

                google.accounts.id.renderButton(
                    document.getElementById('g_id_signin'),
                    { 
                        type: 'standard',
                        theme: 'outline',
                        size: 'large',
                        text: 'signin_with',
                        shape: 'pill',
                        width: '320'
                    }
                );
            }
        }

        window.addEventListener('load', function() {
            setTimeout(initGoogleSignIn, 500);
        });

        function handleGoogleResponse(response) {
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                const nick = payload.name || payload.email.split('@')[0];
                const email = payload.email || '';
                const avatar = payload.picture || '';

                localStorage.setItem('nova_user_nick', nick);
                localStorage.setItem('nova_user_email', email);
                localStorage.setItem('nova_user_avatar', avatar);
                localStorage.setItem('nova_is_admin', 'false');
                localStorage.setItem('nova_google_login', 'true');

                // Запоминаем Google пользователя на 30 дней
                saveRememberMe(nick, email, avatar, 'false', true);

                window.location.href = '/chat';
            } catch (e) {
                document.getElementById('loginError').textContent = 'Ошибка входа через Google';
            }
        }

        // ══════════════════════════════════════════
        // Обычный вход (email + пароль)
        // ══════════════════════════════════════════
        function showForm(form) {
            document.getElementById('loginForm').style.display = form === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = form === 'register' ? 'block' : 'none';
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
            const icon = btn.querySelector('i');
            if (icon) icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const code = document.getElementById('loginCode').value.trim();
            const remember = document.getElementById('rememberMe').checked;
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';

            if (!email || !code) {
                errorEl.textContent = 'Заполните все поля';
                return;
            }

            // Проверяем формат email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorEl.textContent = 'Введите корректный email';
                return;
            }

            const nick = email.split('@')[0];

            // Пробуем войти через /api/auth/email
            try {
                const resp = await fetch('/api/auth/email', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, code: code, action: 'login'})
                });
                const data = await resp.json();

                if (data.success) {
                    const userNick = data.nick || nick;
                    localStorage.setItem('nova_user_nick', userNick);
                    localStorage.setItem('nova_user_email', email);
                    localStorage.setItem('nova_user_avatar', data.avatar || '');
                    localStorage.setItem('nova_is_admin', data.is_admin ? 'true' : 'false');

                    if (remember) {
                        saveRememberMe(userNick, email, data.avatar || '', data.is_admin ? 'true' : 'false', false);
                    } else {
                        localStorage.removeItem('nova_remember_data');
                    }

                    window.location.href = '/chat';
                } else {
                    errorEl.textContent = data.error || 'Неверный email или пароль';
                }
            } catch(e) {
                errorEl.textContent = 'Ошибка подключения. Попробуйте снова.';
            }
        }

        async function handleRegister() {
            const nick = document.getElementById('regNick').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const code = document.getElementById('regCode').value.trim();
            const confirm = document.getElementById('regCodeConfirm').value.trim();
            const agree = document.getElementById('regAgree').checked;
            const errorEl = document.getElementById('regError');
            errorEl.textContent = '';

            if (!nick || !email || !code) { errorEl.textContent = 'Заполните все поля'; return; }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) { errorEl.textContent = 'Введите корректный email'; return; }

            if (code.length < 4) { errorEl.textContent = 'Пароль должен быть не менее 4 символов'; return; }
            if (code !== confirm) { errorEl.textContent = 'Пароли не совпадают'; return; }
            if (!agree) { errorEl.textContent = 'Примите условия использования'; return; }

            errorEl.textContent = 'Регистрация...';
            errorEl.style.color = '#7c3aed';

            try {
                const resp = await fetch('/api/auth/email', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, code: code, nick: nick, action: 'register'})
                });
                const data = await resp.json();

                if (data.success) {
                    localStorage.setItem('nova_user_nick', nick);
                    localStorage.setItem('nova_user_email', email);
                    localStorage.setItem('nova_user_avatar', '');
                    localStorage.setItem('nova_is_admin', 'false');
                    // Запоминаем на 30 дней после регистрации
                    saveRememberMe(nick, email, '', 'false', false);
                    window.location.href = '/chat';
                } else {
                    errorEl.style.color = '#ef4444';
                    errorEl.textContent = data.error || 'Ошибка регистрации';
                }
            } catch(e) {
                errorEl.style.color = '#ef4444';
                errorEl.textContent = 'Ошибка подключения. Попробуйте снова.';
            }
        }

        // Enter для отправки
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginCode').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
            document.getElementById('loginEmail').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
        });
    </script>
</body>
</html>
