name: Groq provider regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - "config.py"
      - "ai_providers.py"
      - "groq_rotation.py"
      - "tests/test_groq_provider.py"
      - ".github/workflows/groq-provider.yml"
  push:
    branches: ["fix/groq-provider-rotation"]
    paths:
      - "config.py"
      - "ai_providers.py"
      - "groq_rotation.py"
      - "tests/test_groq_provider.py"
      - ".github/workflows/groq-provider.yml"

jobs:
  groq-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile changed Python modules
        run: python -m py_compile config.py ai_providers.py groq_rotation.py
      - name: Run Groq regression tests
        run: pytest -q tests/test_groq_provider.py
